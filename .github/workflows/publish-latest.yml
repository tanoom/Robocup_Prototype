name: Publish Latest Commits

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Target public repository (e.g., username/robocup-demo-public)'
        required: true
        type: string
      
      number_of_commits:
        description: 'Number of latest commits to publish'
        required: true
        type: string
        default: '1'
      
      target_branch:
        description: 'Target branch in public repo'
        required: true
        type: string
        default: 'main'
      
      commit_message_prefix:
        description: 'Prefix for commit messages in public repo'
        required: false
        type: string
        default: 'Publish on'

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup publishing environment
        run: |
          # Configure git
          git config user.name "RoboCup Publisher Bot"
          git config user.email "publisher@robocup-demo.org"
          
          # Validate number of commits
          if ! [[ "${{ github.event.inputs.number_of_commits }}" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid number of commits: ${{ github.event.inputs.number_of_commits }}"
            exit 1
          fi
          
          echo "📝 Publishing last ${{ github.event.inputs.number_of_commits }} commits"
          git log --oneline -n ${{ github.event.inputs.number_of_commits }}
      
      - name: Clean repository for public release
        run: |
          echo "🧹 Cleaning repository for public release..."
          
          # Remove sensitive files
          rm -f brain_local.yaml 2>/dev/null || true
          rm -f vision_local.yaml 2>/dev/null || true
          rm -rf .vscode 2>/dev/null || true
          rm -f *.log 2>/dev/null || true
          rm -rf build 2>/dev/null || true
          rm -rf log 2>/dev/null || true
          rm -rf install 2>/dev/null || true
          rm -f .DS_Store 2>/dev/null || true
          
          # Remove any private configuration files
          find . -name "*private*" -type f -delete 2>/dev/null || true
          find . -name "*secret*" -type f -delete 2>/dev/null || true
          find . -name ".env*" -type f -delete 2>/dev/null || true
          
          # Update .gitignore for public repo
          cat > .gitignore << 'EOF'
          .vscode
          *.log
          build/
          log/
          install/
          .DS_Store
          *_local.yaml
          .env*
          *private*
          *secret*
          EOF
          
          echo "✅ Repository cleaned for public release"
      
      - name: Create release commit
        run: |
          # Add all cleaned files
          git add -A
          
          # Create commit with timestamp
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG="${{ github.event.inputs.commit_message_prefix }} $TIMESTAMP"
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
            echo "📦 Created release commit: $COMMIT_MSG"
          else
            echo "ℹ️ No changes to commit"
          fi
      
      - name: Setup SSH and push to public repository
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.PUBLISH_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          # Add public repository as remote
          git remote add public git@github.com:${{ github.event.inputs.target_repository }}.git
          
          echo "🚀 Publishing to ${{ github.event.inputs.target_repository }}"
          
          # Push to public repository
          git push public HEAD:${{ github.event.inputs.target_branch }} --force
          
          echo "✅ Successfully published to public repository!"
          echo "🔗 Check: https://github.com/${{ github.event.inputs.target_repository }}"